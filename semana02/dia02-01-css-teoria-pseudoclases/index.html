<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS teoría</title>
    <style>
        /* Pseudoclases */

        button {
            background-color: tomato;
        }

        button:hover {
            background-color: seagreen;
            cursor: pointer;
        }
        input:focus {
            outline: 3px solid gold;
        }

        button:disabled {
            background-color: lightgray;
        }
        input:checked {
            background-color: lightpink;
        }

        /* Pseudoelemento */

        .tip::before {
            content: "💡 ";
        }

        .obligatorio::after {
            content: " *";
            color: red;
        }

        input::placeholder {
            color: blue;
        }

        ::selection {
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <h1>Pseudoclases</h1>

    <p>Pasa el cursor por el botón y haz clic en el campo.</p>
    <input type="text" placeholder="Escribe aquí" />
    <button>Enviar</button>
    <button disabled>No disponible</button>
    <input type="checkbox"> Apagado

    <h1>Pseudoelementos</h1>

    <p class="tip">Guarda tus archivos con frecuencia.</p>
    <p class="obligatorio">Correo</p>

    <input type="text" placeholder="¿Hola, como estas?">

</body>
</html>
