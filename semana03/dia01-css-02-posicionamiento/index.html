<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS: Posicionamiento </title>
    <style>
        .producto {
            position: relative; /*---- La posición establece los limites (padre es body) ----*/ 
            width: 220px;
            height: 160px;
            background-color: lightcoral;
        }

        .oferta {
            position: absolute;  /*---- Siempre toma en cuenta el elemento padre, que es body, pero esta dentro de producto que es el relative, y se mueve dentro de este ----*/
            top: 8px;
            right: 8px;
            background-color: goldenrod;
        }

        /* Colores para distinguir las barras y altura para poder desplazarte */
    nav { padding: 12px; background-color: lightskyblue; }
    p { margin: 0 0 16px; }
    section { height: 1200px; padding: 16px; }
    footer { padding: 12px; background-color: gold; }

    .aviso {
        position: fixed; /*---- Siempre pegado a la ventana ----*/
        right: 0;
        bottom: 0; /*---- Se queda vinculado al borde final de la ventana y no se mueve ----*/
        left: 0;
}

    .menu {
        position: sticky; /* Se pega al llegar arriba */
        top: 0; /*---- Espacio entre la parte alta y el rectangulo ----*/
    }
    </style>
</head>
<body>
    <div class="producto">
        Zapatillas
        <span class="oferta">-50%</span>
    </div>

    <p>Desplázate hacia abajo y mira qué barras se quedan.</p>
    <nav class="menu">Menú: me pego arriba al llegar</nav>
    <section>Contenido largo de la página…</section>
    <footer class="aviso">Aviso: siempre abajo de la ventana</footer>

</body>
</html>
