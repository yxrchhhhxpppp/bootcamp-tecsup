<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS: Flexbox</title>
    <style>
        body {
            display: flex;

            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .contenedor {
            width: 300px;
            height: 300px;
            background-color: lightgoldenrodyellow;

            display: flex;
            flex-direction: row;
            /* flex-direction: column; */
            gap: 5px;

            /* Alineación horizontal */
            justify-content: start;
            justify-content: center;
            justify-content: end;
            justify-content: space-between;
            justify-content: space-around;

            /* Alineación vertical */
            align-items: start;
            align-items: center;
            align-items: end;
        }

        .box {
            width: 50px;
            height: 50px;
            background-color: coral;
            text-align: center;
            padding: 5px;
        }

        header {
            display: flex;
            flex-direction: row;

            justify-content: space-between;
            width: 100%;
            align-items: center;
        }

        .menu {
            display: flex;
            gap: 10px;
            
        }
    </style>
</head>
<body>
  <!-- TODO: el logo y el menu se visulizaran horizontalmente usando space between y los enlaces dentro de nav tendran un gap de 10px -->
  <header>
    <h1>HolaFlex</h1>
    <nav class="menu">
      <a href="#inicio">Inicio</a>
      <a href="#cursos">Cursos</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <div class="contenedor">
    <div class="box">A</div>
    <div class="box">B</div>
    <div class="box">C</div>
    <!-- <div class="box">D</div> -->
  </div>
</body>
</html>
